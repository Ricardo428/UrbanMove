# Gateway de UrbanMove: sirve la web y reenvía /api/v1/<servicio> a cada microservicio.
# La web y la API comparten origen (localhost:8080), así que el navegador no necesita CORS.
# Sustituye al default.conf de la imagen oficial (se incluye dentro del bloque http).

server {
    listen 80;
    server_name localhost;

    # DNS interno de Docker. El destino de cada ruta va en una variable, así nginx resuelve el
    # nombre en cada petición y no al arrancar: si un servicio está caído, el gateway arranca
    # igual y solo esa ruta responde 502. valid=10s: vuelve a preguntar si el contenedor cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # nginx reenvía todas las cabeceras de la petición (Authorization y X-Correlation-Id incluidas).
    # Estas añaden quién llamó de verdad, porque el servicio ve la IP del gateway.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Si un servicio no contesta, el navegador recibe un 504 en vez de esperar un minuto.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    # La web: ficheros estáticos.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Una ruta por servicio. El nombre (identity, zones...) es el del servicio en docker-compose.
    # proxy_pass sin ruta detrás del host: se reenvía la URI original completa, sin reescribirla.
    location /api/v1/identity {
        set $upstream http://identity:8081;
        proxy_pass $upstream;
    }

    location /api/v1/inventory {
        set $upstream http://inventory:8082;
        proxy_pass $upstream;
    }

    location /api/v1/availability {
        set $upstream http://availability:8083;
        proxy_pass $upstream;
    }

    location /api/v1/reservations {
        set $upstream http://reservations:8084;
        proxy_pass $upstream;
    }

    location /api/v1/zones {
        set $upstream http://zones:8085;
        proxy_pass $upstream;
    }

    location /api/v1/profiles {
        set $upstream http://profiles:8086;
        proxy_pass $upstream;
    }

    location /api/v1/rides {
        set $upstream http://rides:8087;
        proxy_pass $upstream;
    }
}
