services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanmove-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-urbanmove}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urbanmove}
      POSTGRES_DB: urbanmove_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urbanmove}"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.12.0
    container_name: urbanmove-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sns,sqs
      - DEFAULT_REGION=eu-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack-data}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./infra/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

volumes:
  postgres-data: