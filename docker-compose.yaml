services:
  postgres:
    image: postgres:16-alpine
    container_name: urbanmove-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-urbanmove}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-urbanmove}
      POSTGRES_DB: urbanmove_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea una base de datos lógica por microservicio (solo la primera vez que se crea el volumen).
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-urbanmove}"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.12.0
    container_name: urbanmove-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sns,sqs,lambda,events,logs,iam,sts
      # Las Lambdas se ejecutan en contenedores propios; deben unirse a esta red para llamar a reservations.
      - LAMBDA_DOCKER_NETWORK=urbanmove-net
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack-data}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Microservicios: no arrancan con `docker compose up`, solo con el perfil "apps":
  #   docker compose --profile apps up -d --build
  identity:
    profiles: ["apps"]
    container_name: urbanmove-identity
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      # Vienen del .env. Sin JWT_SECRET (mínimo 32 caracteres) identity no arranca.
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Bus de eventos en LocalStack (lo crea Terraform). Si aún no existe, los eventos esperan en la outbox.
      # Credenciales ficticias: LocalStack no las comprueba.
      URBANMOVE_EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:urbanmove-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    profiles: ["apps"]
    container_name: urbanmove-inventory
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
      # Publica VehiclePurchased al dar de alta un recurso: es la única forma de que availability lo conozca.
      URBANMOVE_EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:urbanmove-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy

  availability:
    profiles: ["apps"]
    container_name: urbanmove-availability
    build:
      context: .
      dockerfile: services/availability/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/availability_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
      LOW_BATTERY_THRESHOLD: ${LOW_BATTERY_THRESHOLD:-20}
      # Recibe VehiclePurchased, ReservationCancelled, ReservationExpired y RideFinished por su cola (Terraform).
      URBANMOVE_EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:urbanmove-events
      URBANMOVE_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/urbanmove-availability
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy

  reservations:
    profiles: ["apps"]
    container_name: urbanmove-reservations
    build:
      context: .
      dockerfile: services/reservations/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservations_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      # Con el mismo secreto valida a los usuarios y firma su token de servicio para availability (ADR-006).
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
      AVAILABILITY_URL: http://availability:8083
      # Publica VehicleReserved, ReservationCancelled y ReservationExpired; consume RideStarted.
      URBANMOVE_EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:urbanmove-events
      URBANMOVE_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/urbanmove-reservations
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      availability:
        condition: service_started

  rides:
    profiles: ["apps"]
    container_name: urbanmove-rides
    build:
      context: .
      dockerfile: services/rides/Dockerfile
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rides_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      # Con el mismo secreto valida a los usuarios y firma su token de servicio para los otros tres (ADR-006).
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
      AVAILABILITY_URL: http://availability:8083
      RESERVATIONS_URL: http://reservations:8084
      ZONES_URL: http://zones:8085
      # Para la demo de batería baja: BATTERY_DRAIN_PER_MINUTE=50 en el .env.
      BATTERY_DRAIN_PER_MINUTE: ${BATTERY_DRAIN_PER_MINUTE:-1}
      # Publica RideStarted y RideFinished; no consume eventos, así que no tiene cola.
      URBANMOVE_EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:urbanmove-events
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      availability:
        condition: service_started
      reservations:
        condition: service_started
      zones:
        condition: service_started

  zones:
    profiles: ["apps"]
    container_name: urbanmove-zones
    build:
      context: .
      dockerfile: services/zones/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zones_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      # Solo valida el token de los usuarios; no publica ni consume eventos.
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  profiles:
    profiles: ["apps"]
    container_name: urbanmove-profiles
    build:
      context: .
      dockerfile: services/profiles/Dockerfile
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profiles_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-urbanmove}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-urbanmove}
      # Solo valida el token de los usuarios; no publica ni consume eventos.
      URBANMOVE_JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Gateway nginx: sirve la web de usuarios y reenvía /api/v1/<servicio> a cada microservicio.
  # Sin depends_on a propósito: resuelve los nombres en cada petición, así que arranca aunque
  # falte algún servicio (esa ruta da 502). Prueba: apps/web/smoke-test.sh
  web:
    profiles: ["apps"]
    container_name: urbanmove-web
    build:
      context: ./apps/web
    ports:
      - "8080:80"

# Red con nombre fijo (en vez de <carpeta>_default) para que LocalStack sepa a cuál conectar las Lambdas.
networks:
  default:
    name: urbanmove-net

volumes:
  postgres-data:
